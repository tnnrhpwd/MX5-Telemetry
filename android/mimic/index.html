<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MX5 car app mimic (700x367dp)</title>
<!--
  The car app rendered in a browser at the head unit's real dp geometry, so the design can
  be iterated and screenshot without a phone.

  Open directly from disk; there is no build step and no server:

      android/mimic/index.html?screen=rpm&scheme=ocean&mode=light

  700x367 is 919x480 at the car's 209dpi, which is the size Ui.java's dp maths actually
  lays out in: the old 800x480 canvas here was 113dp taller than the car, and three
  screens were clipped in the car while looking complete in a browser. ?canvas=800x480
  brings the old one back for comparison.

  Colors come from tokens.js, which extract_tokens.py generates from Palette.java, so the
  palette here is the app's palette rather than a copy of it. The DOM is hand-written to
  mirror Ui.java; that is the one thing that can drift, so the Java stays the source of truth
  and the device stays the final check.

  Run extract_tokens.py again after changing Palette.java or Ui.java.
-->
<link rel="stylesheet" href="mimic.css">
</head>
<body>
  <div id="device"></div>
  <script src="tokens.js"></script>
  <script src="mimic.js"></script>
</body>
</html>
