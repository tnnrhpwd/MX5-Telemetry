plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mx5.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.mx5.remote"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The Car App Library is the one dependency, and it is load-bearing: the parked
// "game" activity is hidden by Android Auto while the car is moving, so a
// DRIVING-category CarAppService is the only supported way to stay visible in
// motion. Everything else (HTTP, JSON) still comes from the platform.
dependencies {
    implementation 'androidx.car.app:app:1.4.0'
}
