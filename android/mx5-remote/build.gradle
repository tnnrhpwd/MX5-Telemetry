plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mx5.remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.mx5.remote"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Deliberately no dependencies.
//
// HTTP is HttpURLConnection and JSON is org.json, both in the platform, so there is
// nothing to resolve and nothing that can clash. The Car App Library is not used
// either: this is a parked-app "game" that draws its own UI full screen, which is
// the mechanism that does not need Play approval.
