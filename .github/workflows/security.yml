# Security Scanning Workflow
# Runs secret-leak detection on every push/PR and weekly, so real credentials
# (WiFi passwords, API keys, tokens, etc.) can never be merged/pushed unnoticed again.

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          extra_args: --only-verified

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Hardcoded credential guard
        run: python scripts/check_hardcoded_secrets.py
