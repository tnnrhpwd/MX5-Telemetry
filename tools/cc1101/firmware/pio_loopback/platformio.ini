; CC1101 loopback test: one module transmits a known carrier, the other
; receives and prints RSSI. Proves the receive chain and measures the
; sensitivity penalty at 315 MHz vs the module's native 433 MHz band.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_protocol = arduino
upload_port = COM3
upload_speed = 115200

monitor_speed = 115200

lib_extra_dirs = ../pio_nano/lib
