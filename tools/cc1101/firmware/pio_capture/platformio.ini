; CC1101 raw-bit capture tool (v1)
; Captures the raw demodulated bitstream on GDO0 and dumps it over serial.
; Shares the vendored CC1101 library from the monitor project.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_protocol = arduino
upload_port = COM3
upload_speed = 115200

monitor_speed = 115200

lib_extra_dirs = ../pio_nano/lib
