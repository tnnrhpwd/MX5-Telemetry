; PlatformIO project for the CC1101 bedroom bench scan
; Host: Arduino Nano (ATmega328P) on the breadboard
; Sketch source: src/main.cpp  (mirrors tools/cc1101/cc1101_scan/cc1101_scan.ino)

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Matches the settings proven on this machine's Nano in arduino/platformio.ini
upload_protocol = arduino
upload_port = COM3
upload_speed = 115200

monitor_speed = 115200

; Library vendored in lib/SmartRC-CC1101-Driver-Lib (the PlatformIO registry
; package fails to install on Windows due to its long example-file paths).
