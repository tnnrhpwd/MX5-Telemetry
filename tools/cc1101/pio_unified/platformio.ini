; CC1101 unified firmware: live RSSI (for the webapp) + raw burst capture.
; One sketch does both, so the webapp and raw capture share one serial port.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

upload_protocol = arduino
upload_port = COM3
upload_speed = 115200

monitor_speed = 115200

lib_extra_dirs = ../pio_nano/lib
